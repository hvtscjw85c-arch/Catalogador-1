<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Football Studio Catalogador</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;margin:0;background:#f3f4f6;color:#111827}
main{max-width:680px;margin:auto;padding:18px}
h1{font-size:25px;margin:5px 0 4px}.sub{color:#6b7280;margin-bottom:18px}
.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;background:#e5e7eb;color:#111827}
button:active{transform:scale(.98)}
.h{background:#dbeafe}.a{background:#fee2e2}.d{background:#fef3c7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f9fafb;border-radius:12px;padding:12px;text-align:center}.num{font-size:25px;font-weight:800}
.sequence{font-size:21px;line-height:1.8;word-break:break-all}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:13px;color:#6b7280}.danger{background:#fee2e2}.primary{background:#111827;color:white}
#history{max-height:330px;overflow:auto}
.row{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid #eee}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent} </style>
</head>
<body>
<main>
<h1>⚽ Football Studio</h1>
<div class="sub">Catalogador personal — H / A / D</div>

<div class="card">
  <div class="buttons">
    <button type="button" class="h" id="btnH">HOME</button>
    <button type="button" class="a" id="btnA">AWAY</button>
    <button type="button" class="d" id="btnD">DRAW</button>
  </div>
  <p class="small">Tocá el resultado después de cada ronda.</p>
</div>

<div class="card">
  <b>Estadísticas</b>
  <div class="stats" style="margin-top:10px">
    <div class="stat"><div class="num" id="h">0</div>HOME</div>
    <div class="stat"><div class="num" id="a">0</div>AWAY</div>
    <div class="stat"><div class="num" id="d">0</div>DRAW</div>
  </div>
</div>

<div class="card">
  <b>Esperas actuales</b>
  <div class="stats" style="margin-top:10px">
    <div class="stat"><div class="num" id="eh">—</div>HOME</div>
    <div class="stat"><div class="num" id="ea">—</div>AWAY</div>
    <div class="stat"><div class="num" id="ed">—</div>DRAW</div>
  </div>
</div>

<div class="card">
  <b>Racha actual</b>
  <div id="streak" style="font-size:22px;margin-top:8px">—</div>
</div>

<div class="card">
  <b>Últimas 50</b>
  <div id="seq" class="sequence" style="margin-top:7px">Todavía no hay resultados.</div>
</div>

<div class="card">
  <b>Historial</b>
  <div id="history" style="margin-top:8px"></div>
</div>

<div class="card actions">
  <button onclick="undo()">↩️ Deshacer</button>
  <button onclick="exportCSV()">📄 Exportar CSV</button>
  <button class="danger" onclick="clearAll()">🗑️ Borrar todo</button>
  <button class="primary" onclick="location.reload()">🔄 Actualizar</button>
</div>
<div class="small" style="text-align:center;margin:16px 0">Los datos se guardan localmente en este navegador.</div>
</main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('btnH').addEventListener('click',()=>add('H'));
  document.getElementById('btnA').addEventListener('click',()=>add('A'));
  document.getElementById('btnD').addEventListener('click',()=>add('D'));
});

let results=JSON.parse(localStorage.getItem('fs_results')||'[]');
function save(){localStorage.setItem('fs_results',JSON.stringify(results));render()}
function add(x){results.push({r:results.length+1,x,t:new Date().toLocaleTimeString()});save()}
function undo(){if(results.length){results.pop();results.forEach((v,i)=>v.r=i+1);save()}}
function clearAll(){if(confirm('¿Borrar todo el historial?')){results=[];save()}}
function render(){
 let c={H:0,A:0,D:0};results.forEach(v=>c[v.x]++);
 ['h','a','d'].forEach(k=>document.getElementById(k).textContent=c[k.toUpperCase()]);
 let waits={H:'—',A:'—',D:'—'};
 ['H','A','D'].forEach(x=>{let i=-1;for(let j=results.length-1;j>=0;j--)if(results[j].x===x){i=j;break} waits[x]=i<0?results.length:(results.length-1-i)});
 document.getElementById('eh').textContent=waits.H;document.getElementById('ea').textContent=waits.A;document.getElementById('ed').textContent=waits.D;
 let last=results.at(-1);let n=0;if(last){for(let i=results.length-1;i>=0&&results[i].x===last.x;i--)n++;document.getElementById('streak').textContent=(last.x==='H'?'HOME':last.x==='A'?'AWAY':'DRAW')+' × '+n}else document.getElementById('streak').textContent='—';
 let recent=results.slice(-50).map(v=>v.x).join(' · ');document.getElementById('seq').textContent=recent||'Todavía no hay resultados.';
 document.getElementById('history').innerHTML=results.slice().reverse().map(v=>`<div class="row"><span>#${v.r} — <b>${v.x}</b></span><span class="small">${v.t}</span></div>`).join('')||'<span class="small">Sin resultados.</span>';
}
function exportCSV(){
 let csv='Ronda,Resultado,Hora\n'+results.map(v=>`${v.r},${v.x},${v.t}`).join('\n');
 let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='football_studio_historial.csv';a.click()
}
render();
</script>
</body>
</html>
